name: Deploy

# Builds AGCONN's eleven images, pushes them to GHCR, then rolls them out to the
# shared `aks-sparx-prod-cus` cluster in the `agconn` namespace — co-tenant with
# sparx, jotacular, kanNINJA and SilicaUI.
#
# WHAT CHANGED FROM THE GKE PIPELINE THIS REPLACES. AGCONN moved off GKE +
# Artifact Registry onto the shared AKS cluster. See
# docs/00-foundation/10-infra-cicd/09-azure-migration.md.
#
#   - COMPUTE ONLY. The data layer did NOT move: Postgres and object storage stay
#     on Supabase, reached from the cluster over the public internet. Every
#     DATABASE_* and SUPABASE_* value below is the same value it was on GKE; only
#     where it is READ FROM changed.
#   - AUTH is workload identity federation, no stored credential. Azure trusts a
#     GitHub OIDC token whose subject is
#     `repo:brandonkorous/AgConnect:ref:refs/heads/main`. The four AZURE_* values
#     are repository VARIABLES, not secrets — they are public identifiers, and
#     treating them as secrets only makes a failed run harder to read.
#   - SECRETS still come from GitHub Actions, unlike every other tenant on this
#     cluster, which read Key Vault. kv-agconn-prod-cus exists and is ready; the
#     migration is deferred because GitHub secrets cannot be read back, so moving
#     them means re-sourcing a third of them from vendor dashboards — a cost that
#     buys nothing for this deploy. `scripts/load-keyvault.mjs` does it when
#     there is time.
#   - NO cert-manager, NO nginx-ingress. TLS and routing for agconn.com /
#     www / api / admin are handled by the shared Caddy proxy in the `sparx-prod`
#     namespace (reserved IP 20.12.217.0), which reaches these Services
#     cross-namespace. Route blocks live in sparx.works/k8s/ingress/Caddyfile,
#     and all four hostnames must ALSO be allow-listed in api-rest's
#     PLATFORM_HOSTNAMES or on-demand TLS is denied and Cloudflare 525s.
#
# NEXT_PUBLIC_* are baked into the client bundle at build time and are public by
# definition. The ones that are plain facts about production — the API and admin
# origins — are LITERALS here rather than secrets: a repository secret that is
# never set renders as the empty string instead of failing, which is how the
# admin app came to ship with a blank `metadataBase`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options: [prod]

concurrency:
  group: deploy-aks-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # required for federated auth to Azure

env:
  RESOURCE_GROUP: rg-sparx-prod-cus
  CLUSTER: aks-sparx-prod-cus
  NAMESPACE: agconn
  # GHCR, matching every other tenant on this cluster.
  #
  # THE NAMES ARE HYPHENATED — `agconn-web`, NOT `agconn/web`. GHCR treats a
  # slash as a package path under the owner, and the cluster pulls anonymously,
  # which requires the packages to be PUBLIC. Nothing in deploy/k8s carries an
  # imagePullSecret for that reason. A pod sitting in ImagePullBackOff with a 401
  # means a package's visibility reverted to private — check that before the tag.
  REGISTRY: ghcr.io/brandonkorous
  IMAGE_PREFIX: agconn

jobs:
  build:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: web,             dockerfile: apps/web/Dockerfile }
          - { name: admin,           dockerfile: apps/admin/Dockerfile }
          - { name: api,             dockerfile: services/api/Dockerfile }
          - { name: email-worker,    dockerfile: services/email-worker/Dockerfile }
          - { name: sms-worker,      dockerfile: services/sms-worker/Dockerfile }
          - { name: flc-verifier,    dockerfile: services/flc-verifier/Dockerfile }
          - { name: audit-retention, dockerfile: services/audit-retention/Dockerfile }
          - { name: audit-verifier,  dockerfile: services/audit-verifier/Dockerfile }
          - { name: resume-parser,   dockerfile: services/resume-parser/Dockerfile }
          - { name: cert-generator,  dockerfile: services/cert-generator/Dockerfile }
          - { name: scheduler,       dockerfile: services/scheduler/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.target.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }},ignore-error=true
          build-args: |
            NODE_VERSION=22.12.0
            PNPM_VERSION=10.9.0
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_API_BASE_URL=https://api.agconn.com
            NEXT_PUBLIC_ADMIN_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_ADMIN_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_ADMIN_URL=https://admin.agconn.com
            NEXT_PUBLIC_SENTRY_DSN_ADMIN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN_ADMIN }}
            SENTRY_RELEASE=${{ github.sha }}
          secrets: |
            fontawesome_token=${{ secrets.FONTAWESOME_TOKEN }}

  deploy:
    name: Deploy to AKS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" \
            --overwrite-existing

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Ensure namespace, ServiceAccount and ConfigMap
        run: |
          set -euo pipefail
          kubectl apply -f deploy/k8s/base/namespace.yaml
          kubectl apply -f deploy/k8s/base/service-account.yaml
          kubectl apply -f deploy/k8s/base/configmap.yaml

      # ---------------------------------------------------------------------
      # GitHub Actions secrets -> agconn-env
      #
      # NOT Key Vault, and that is a deliberate reversal. kv-agconn-prod-cus
      # exists and is the platform convention on this cluster, but GitHub secrets
      # are WRITE ONLY — they cannot be read back — so migrating them means
      # re-sourcing ten of the twenty-six from the Clerk, Resend, Twilio and
      # Stripe dashboards. That cost buys a property (readable, versioned,
      # rotatable without repo admin) which matters on a future rotation, not on
      # this deploy. Move when there is time: scripts/load-keyvault.mjs does it.
      #
      # TWO VALUES ARE DELIBERATELY ABSENT BELOW, because they are not secrets:
      #
      #   NEXT_PUBLIC_ADMIN_URL   https://admin.agconn.com
      #   WEB_INTERNAL_BASE_URL   http://web   (cluster DNS for the Service)
      #
      # Both live in deploy/k8s/base/configmap.yaml now, where they are
      # reviewable in git. They MUST NOT also appear here. `envFrom` lists
      # configMapRef BEFORE secretRef, so a Secret key wins — and an unset
      # `${{ secrets.X }}` renders as the empty string rather than failing, which
      # would silently override the good ConfigMap value with a blank.
      #
      # That is not hypothetical: it is what the GKE pipeline was doing. Both of
      # those, plus INTERNAL_REVALIDATE_SECRET, were referenced as repository
      # secrets that were never set, so the revalidate hook has been signing with
      # an empty key and posting to an empty base URL.
      # ---------------------------------------------------------------------
      - name: Resolve the shared revalidate secret
        id: revalidate
        run: |
          set -euo pipefail
          # api signs a payload that web verifies, so both pods must hold the
          # SAME value. Minting a fresh one per deploy would work in steady state
          # and break during the rollout: api and web roll separately, so for a
          # few minutes an old pod and a new pod disagree and every revalidate
          # call fails closed, with nothing in either log naming a key mismatch.
          #
          # So read back what the cluster already holds and reuse it. The Secret
          # is the persistence layer. The first deploy mints one; every later
          # deploy keeps it. Deleting the Secret re-mints, which is harmless.
          existing=$(kubectl -n "$NAMESPACE" get secret agconn-env \
                       -o jsonpath='{.data.INTERNAL_REVALIDATE_SECRET}' 2>/dev/null \
                     | base64 -d 2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "reusing the INTERNAL_REVALIDATE_SECRET already in the cluster"
            value="$existing"
          else
            # `tr -d` is not decoration. openssl emits a trailing newline, and a
            # stray byte in key material does not fail loudly — it silently
            # produces a DIFFERENT key on one side of the signature.
            value=$(openssl rand -base64 48 | tr -d '\r\n')
            echo "minted a new INTERNAL_REVALIDATE_SECRET (none was set)"
          fi
          echo "::add-mask::$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Apply the runtime Secret
        env:
          DATABASE_URL:                            ${{ secrets.DATABASE_URL }}
          DIRECT_URL:                              ${{ secrets.DIRECT_URL }}
          AUDIT_HMAC_KEY:                          ${{ secrets.AUDIT_HMAC_KEY }}
          AUDIT_HMAC_KEY_VERSION:                  ${{ secrets.AUDIT_HMAC_KEY_VERSION }}
          ADMIN_BEARER_TOKEN:                      ${{ secrets.ADMIN_BEARER_TOKEN }}
          PARTICIPANT_PEPPER:                      ${{ secrets.PARTICIPANT_PEPPER }}
          CLERK_SECRET_KEY:                        ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:       ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_WEBHOOK_SECRET:                    ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CLERK_ENCRYPTION_KEY:                    ${{ secrets.CLERK_ENCRYPTION_KEY }}
          ADMIN_CLERK_SECRET_KEY:                  ${{ secrets.ADMIN_CLERK_SECRET_KEY }}
          NEXT_PUBLIC_ADMIN_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_ADMIN_CLERK_PUBLISHABLE_KEY }}
          RESEND_API_KEY:                          ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET:                   ${{ secrets.RESEND_WEBHOOK_SECRET }}
          WAITLIST_TOKEN_SECRET:                   ${{ secrets.WAITLIST_TOKEN_SECRET }}
          SUPABASE_URL:                            ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:               ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWILIO_ACCOUNT_SID:                      ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:                       ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_MESSAGING_SERVICE_SID:            ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          TWILIO_INBOUND_PHONE:                    ${{ secrets.TWILIO_INBOUND_PHONE }}
          STRIPE_SECRET_KEY:                       ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:                   ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PRO_MONTHLY:                ${{ secrets.STRIPE_PRICE_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_YEARLY:                 ${{ secrets.STRIPE_PRICE_PRO_YEARLY }}
          STRIPE_PRICE_ENT_MONTHLY:                ${{ secrets.STRIPE_PRICE_ENT_MONTHLY }}
          STRIPE_PRICE_ENT_YEARLY:                 ${{ secrets.STRIPE_PRICE_ENT_YEARLY }}
          STRIPE_PRICE_PRO_FOUNDER_MONTHLY:        ${{ secrets.STRIPE_PRICE_PRO_FOUNDER_MONTHLY }}
          STRIPE_PRICE_PRO_FOUNDER_YEARLY:         ${{ secrets.STRIPE_PRICE_PRO_FOUNDER_YEARLY }}
          STRIPE_PRICE_ENT_FOUNDER_MONTHLY:        ${{ secrets.STRIPE_PRICE_ENT_FOUNDER_MONTHLY }}
          STRIPE_PRICE_ENT_FOUNDER_YEARLY:         ${{ secrets.STRIPE_PRICE_ENT_FOUNDER_YEARLY }}
          SENTRY_DSN:                              ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN:                  ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN:                       ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:                              ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:                          ${{ secrets.SENTRY_PROJECT }}
          SENTRY_PROJECT_ADMIN:                    ${{ secrets.SENTRY_PROJECT_ADMIN }}
          NEXT_PUBLIC_SENTRY_DSN_ADMIN:            ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_ADMIN }}
          NEXT_PUBLIC_POSTHOG_KEY:                 ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          POSTHOG_API_KEY:                         ${{ secrets.POSTHOG_API_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN:                ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          ANTHROPIC_API_KEY:                       ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:                          ${{ secrets.OPENAI_API_KEY }}
          WIZELENS_KEY_WEB:                        ${{ secrets.WIZELENS_KEY_WEB }}
          WIZELENS_KEY_ADMIN:                      ${{ secrets.WIZELENS_KEY_ADMIN }}
          WIZELENS_KEY_API:                        ${{ secrets.WIZELENS_KEY_API }}
          WIZELENS_KEY_EMAIL_WORKER:               ${{ secrets.WIZELENS_KEY_EMAIL_WORKER }}
          WIZELENS_KEY_SMS_WORKER:                 ${{ secrets.WIZELENS_KEY_SMS_WORKER }}
          WIZELENS_KEY_FLC_VERIFIER:               ${{ secrets.WIZELENS_KEY_FLC_VERIFIER }}
          WIZELENS_KEY_RESUME_PARSER:              ${{ secrets.WIZELENS_KEY_RESUME_PARSER }}
          WIZELENS_KEY_CERT_GENERATOR:             ${{ secrets.WIZELENS_KEY_CERT_GENERATOR }}
          WIZELENS_KEY_SCHEDULER:                  ${{ secrets.WIZELENS_KEY_SCHEDULER }}
          INTERNAL_REVALIDATE_SECRET:              ${{ steps.revalidate.outputs.value }}
          SENTRY_RELEASE:                          ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077

          # Required is anything whose absence stops a pod booting or breaks a
          # core flow. An unset repository secret renders as the empty string
          # rather than an error, so this loop is the only thing between a
          # missing credential and a pod that starts and then misbehaves.
          required=(
            DATABASE_URL DIRECT_URL
            AUDIT_HMAC_KEY AUDIT_HMAC_KEY_VERSION
            ADMIN_BEARER_TOKEN PARTICIPANT_PEPPER
            CLERK_SECRET_KEY NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            CLERK_WEBHOOK_SECRET CLERK_ENCRYPTION_KEY
            ADMIN_CLERK_SECRET_KEY NEXT_PUBLIC_ADMIN_CLERK_PUBLISHABLE_KEY
            RESEND_API_KEY RESEND_WEBHOOK_SECRET
            WAITLIST_TOKEN_SECRET
            SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
            TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN
            TWILIO_MESSAGING_SERVICE_SID TWILIO_INBOUND_PHONE
            STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
            INTERNAL_REVALIDATE_SECRET SENTRY_RELEASE
          )

          # Observability (incl. one WizeLens ingest key per app), maps, billing
          # price ids and the LLM keys. Absent is a supported state for each; the
          # platform boots without them.
          optional=(
            STRIPE_PRICE_PRO_MONTHLY STRIPE_PRICE_PRO_YEARLY
            STRIPE_PRICE_ENT_MONTHLY STRIPE_PRICE_ENT_YEARLY
            STRIPE_PRICE_PRO_FOUNDER_MONTHLY STRIPE_PRICE_PRO_FOUNDER_YEARLY
            STRIPE_PRICE_ENT_FOUNDER_MONTHLY STRIPE_PRICE_ENT_FOUNDER_YEARLY
            SENTRY_DSN NEXT_PUBLIC_SENTRY_DSN SENTRY_AUTH_TOKEN
            SENTRY_ORG SENTRY_PROJECT SENTRY_PROJECT_ADMIN
            NEXT_PUBLIC_SENTRY_DSN_ADMIN
            NEXT_PUBLIC_POSTHOG_KEY POSTHOG_API_KEY
            NEXT_PUBLIC_MAPBOX_TOKEN
            ANTHROPIC_API_KEY OPENAI_API_KEY
            WIZELENS_KEY_WEB WIZELENS_KEY_ADMIN WIZELENS_KEY_API
            WIZELENS_KEY_EMAIL_WORKER WIZELENS_KEY_SMS_WORKER
            WIZELENS_KEY_FLC_VERIFIER WIZELENS_KEY_RESUME_PARSER
            WIZELENS_KEY_CERT_GENERATOR WIZELENS_KEY_SCHEDULER
          )

          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Unset repository secrets: ${missing[*]}"
            echo "Set one with: gh secret set <NAME> -R ${{ github.repository }}"
            exit 1
          fi

          # Empty values are SKIPPED, never written as "". A key present with an
          # empty value would shadow the ConfigMap entry of the same name, which
          # is the failure this whole block is arranged to avoid.
          : > /tmp/agconn.env
          for name in "${required[@]}" "${optional[@]}"; do
            if [ -n "${!name:-}" ]; then
              printf '%s=%s\n' "$name" "${!name}" >> /tmp/agconn.env
            else
              echo "optional secret absent: $name"
            fi
          done

          if ! grep -qE '^(ANTHROPIC_API_KEY|OPENAI_API_KEY)=' /tmp/agconn.env; then
            echo "::warning::No LLM key set — resume parsing and LLM-assisted translation are disabled this deploy."
          fi

          keys=$(wc -l < /tmp/agconn.env)
          kubectl create secret generic agconn-env -n "$NAMESPACE" \
            --from-env-file=/tmp/agconn.env \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/agconn.env
          echo "Applied agconn-env with ${keys} keys."
      # ---------------------------------------------------------------------
      # Migrations run as an in-cluster Job rather than from this runner.
      #
      # Supabase IS publicly reachable, so the runner COULD do it — the reason it
      # does not is that the Job runs the exact image being deployed, which keeps
      # the schema and the code that expects it in lockstep. It also keeps the
      # step identical for the day the database moves into the VNet, where an
      # in-cluster Job stops being a preference and becomes the only thing that
      # can reach it.
      #
      # The Job name carries the tag, so each deploy creates a fresh one and this
      # step waits on that specific Job rather than a stale completed one.
      #
      # Prisma's schema engine reads DIRECT_URL (packages/db/prisma.config.ts),
      # not DATABASE_URL — transaction-mode pooling breaks its prepared
      # statements. Both are in agconn-env, so the manifest needs no special
      # wiring; it is worth knowing when a migration fails with a prepared
      # statement error.
      # ---------------------------------------------------------------------
      - name: Migrate the schema
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          API_IMAGE="${REGISTRY}/${IMAGE_PREFIX}-api:${TAG}"

          kubectl delete job "db-migrate-${TAG}" -n "$NAMESPACE" --ignore-not-found

          sed -e "s|REPLACE_IMAGE|${API_IMAGE}|g" -e "s|REPLACE_TAG|${TAG}|g" \
            deploy/k8s/base/db-migrate-job.yaml | kubectl apply -f -

          if ! kubectl wait --for=condition=complete "job/db-migrate-${TAG}" \
                 -n "$NAMESPACE" --timeout=600s; then
            echo "::error::Migration job did not complete. Logs follow."
            kubectl logs "job/db-migrate-${TAG}" -n "$NAMESPACE" --tail=200 || true
            exit 1
          fi
          kubectl logs "job/db-migrate-${TAG}" -n "$NAMESPACE" --tail=50

      - name: Pin image tags
        working-directory: deploy/k8s/overlays/prod
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          for img in web admin api email-worker sms-worker flc-verifier \
                     audit-retention audit-verifier resume-parser \
                     cert-generator scheduler; do
            kustomize edit set image \
              "${REGISTRY}/${IMAGE_PREFIX}-${img}=${REGISTRY}/${IMAGE_PREFIX}-${img}:${TAG}"
          done

      - name: Apply manifests
        run: |
          set -euo pipefail
          kubectl apply -k deploy/k8s/overlays/prod

      # Rollout waits are split from the apply so a hung Deployment names itself
      # in the log instead of failing an opaque combined step.
      #
      # The node is single and shared with four other products: every Deployment
      # here is `replicas: 1`, so a rollout SURGES one extra pod each while images
      # are still pulling. If a rollout times out with the pod Pending, read
      # `kubectl -n agconn describe pod` before assuming the image is bad —
      # insufficient memory and a leftover nodeSelector both look like this.
      - name: Wait for rollouts
        run: |
          set -euo pipefail
          for d in web admin api email-worker sms-worker scheduler \
                   flc-verifier resume-parser cert-generator; do
            echo "--- rollout: $d"
            kubectl -n "$NAMESPACE" rollout status "deployment/$d" --timeout=10m
          done

      - name: Ping IndexNow with sitemap URLs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_KEY_LOCATION: https://agconn.com/indexnow-key.txt
          SITE_URL: https://agconn.com
        run: |
          if [ -z "${INDEXNOW_KEY:-}" ]; then
            echo "[indexnow] skipping — INDEXNOW_KEY secret not set"
            exit 0
          fi
          node scripts/indexnow-ping.mjs
