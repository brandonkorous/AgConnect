name: Deploy

# Builds AGCONN's eleven images, pushes them to GHCR, then rolls them out to the
# shared `aks-sparx-prod-cus` cluster in the `agconn` namespace — co-tenant with
# sparx, jotacular, kanNINJA and SilicaUI.
#
# WHAT CHANGED FROM THE GKE PIPELINE THIS REPLACES. AGCONN moved off GKE +
# Artifact Registry onto the shared AKS cluster. See
# docs/00-foundation/10-infra-cicd/09-azure-migration.md.
#
#   - DATA (AG-11): Postgres is psql-agconn-prod-cus (private, in the VNet) and files are
#     in Azure Blob (stagconnprodcus). Pods connect as agconn_app through PgBouncer;
#     migrations and the role SQL run as agconn_owner. The vault values come from
#     wize-infrastructure's terraform/envs/azure/agconn.tf.
#   - AUTH is workload identity federation, no stored credential. Azure trusts a
#     GitHub OIDC token whose subject is
#     `repo:wizeworksllc/AgConnect:ref:refs/heads/main`. The four AZURE_* values
#     are repository VARIABLES, not secrets — they are public identifiers, and
#     treating them as secrets only makes a failed run harder to read.
#   - SECRETS come from kv-agconn-prod-cus, like every other tenant on this
#     cluster. A secret named FOO_BAR is stored as FOO-BAR (Key Vault allows no
#     underscores; case is kept). This identity holds Secrets USER there: it can
#     read the bundle and can never rewrite a credential it is about to ship.
#     Set or rotate one with:
#       az keyvault secret set --vault-name kv-agconn-prod-cus --name FOO-BAR --value '...'
#   - NO cert-manager, NO nginx-ingress. TLS and routing for agconn.com /
#     www / api / admin are handled by the shared Caddy proxy in the `sparx-prod`
#     namespace (reserved IP 20.12.217.0), which reaches these Services
#     cross-namespace. Route blocks live in wize-infrastructure's
#     k8s/ingress/Caddyfile (wizeworksllc/wize-infrastructure, applied by that
#     repo's own release, as is terraform/envs/azure/agconn.tf), and all four
#     hostnames must ALSO be allow-listed in sparx's api-rest
#     PLATFORM_HOSTNAMES or on-demand TLS is denied and Cloudflare 525s.
#
# NEXT_PUBLIC_* are baked into the client bundle at build time and are public by
# definition. The ones that are plain facts about production — the API and admin
# origins — are LITERALS here rather than secrets: a repository secret that is
# never set renders as the empty string instead of failing, which is how the
# admin app came to ship with a blank `metadataBase`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options: [prod]

concurrency:
  group: deploy-aks-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # required for federated auth to Azure

env:
  RESOURCE_GROUP: rg-sparx-prod-cus
  CLUSTER: aks-sparx-prod-cus
  NAMESPACE: agconn
  # GHCR, matching every other tenant on this cluster.
  #
  # THE NAMES ARE HYPHENATED — `agconn-web`, NOT `agconn/web`. GHCR treats a
  # slash as a package path under the owner, and the cluster pulls anonymously,
  # which requires the packages to be PUBLIC. Nothing in deploy/k8s carries an
  # imagePullSecret for that reason. A pod sitting in ImagePullBackOff with a 401
  # means a package's visibility reverted to private — check that before the tag.
  REGISTRY: ghcr.io/wizeworksllc
  IMAGE_PREFIX: agconn
  VAULT: kv-agconn-prod-cus

jobs:
  build:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: web,             dockerfile: apps/web/Dockerfile }
          - { name: admin,           dockerfile: apps/admin/Dockerfile }
          - { name: api,             dockerfile: services/api/Dockerfile }
          - { name: email-worker,    dockerfile: services/email-worker/Dockerfile }
          - { name: sms-worker,      dockerfile: services/sms-worker/Dockerfile }
          - { name: flc-verifier,    dockerfile: services/flc-verifier/Dockerfile }
          - { name: audit-retention, dockerfile: services/audit-retention/Dockerfile }
          - { name: audit-verifier,  dockerfile: services/audit-verifier/Dockerfile }
          - { name: resume-parser,   dockerfile: services/resume-parser/Dockerfile }
          - { name: cert-generator,  dockerfile: services/cert-generator/Dockerfile }
          - { name: scheduler,       dockerfile: services/scheduler/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The client bundle bakes NEXT_PUBLIC_* in at build time, so this job reads
      # them too. A missing one fails here rather than shipping a blank into the
      # bundle, which is how an unset repository secret used to behave.
      - name: Read build values from Key Vault
        id: kv
        run: |
          set -euo pipefail
          required=(FONTAWESOME_TOKEN NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
                    NEXT_PUBLIC_ADMIN_CLERK_PUBLISHABLE_KEY)
          optional=(NEXT_PUBLIC_SENTRY_DSN NEXT_PUBLIC_SENTRY_DSN_ADMIN
                    NEXT_PUBLIC_POSTHOG_KEY NEXT_PUBLIC_MAPBOX_TOKEN)
          missing=()
          for name in "${required[@]}" "${optional[@]}"; do
            if value=$(az keyvault secret show --vault-name "$VAULT" --name "${name//_/-}" \
                         --query value -o tsv 2>/dev/null); then
              echo "::add-mask::$value"
              echo "$name=$value" >> "$GITHUB_OUTPUT"
            elif [[ " ${required[*]} " == *" $name "* ]]; then
              missing+=("${name//_/-}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets in $VAULT: ${missing[*]}"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.target.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }},ignore-error=true
          build-args: |
            NODE_VERSION=22.12.0
            PNPM_VERSION=10.9.0
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ steps.kv.outputs.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ steps.kv.outputs.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ steps.kv.outputs.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ steps.kv.outputs.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_API_BASE_URL=https://api.agconn.com
            NEXT_PUBLIC_ADMIN_CLERK_PUBLISHABLE_KEY=${{ steps.kv.outputs.NEXT_PUBLIC_ADMIN_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_ADMIN_URL=https://admin.agconn.com
            NEXT_PUBLIC_SENTRY_DSN_ADMIN=${{ steps.kv.outputs.NEXT_PUBLIC_SENTRY_DSN_ADMIN }}
            SENTRY_RELEASE=${{ github.sha }}
          secrets: |
            fontawesome_token=${{ steps.kv.outputs.FONTAWESOME_TOKEN }}

  deploy:
    name: Deploy to AKS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" \
            --overwrite-existing

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Ensure namespace, ServiceAccount and ConfigMap
        run: |
          set -euo pipefail
          kubectl apply -f deploy/k8s/base/namespace.yaml
          kubectl apply -f deploy/k8s/base/service-account.yaml
          kubectl apply -f deploy/k8s/base/configmap.yaml

      # ---------------------------------------------------------------------
      # Key Vault -> agconn-env
      #
      # TWO VALUES ARE DELIBERATELY ABSENT BELOW, because they are not secrets:
      #
      #   NEXT_PUBLIC_ADMIN_URL   https://admin.agconn.com
      #   WEB_INTERNAL_BASE_URL   http://web   (cluster DNS for the Service)
      #
      # Both live in deploy/k8s/base/configmap.yaml, where they are reviewable in
      # git. They MUST NOT also go into the vault. `envFrom` lists configMapRef
      # BEFORE secretRef, so a Secret key wins over the ConfigMap entry.
      #
      # INTERNAL_REVALIDATE_SECRET is signed by api and verified by web, so both
      # pods must hold the SAME value. It lives in the vault like any other key.
      # Rotating it means a few minutes of failed revalidate calls while api and
      # web roll separately, with nothing in either log naming a key mismatch.
      # ---------------------------------------------------------------------
      - name: Apply the runtime Secret
        env:
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077

          # Required is anything whose absence stops a pod booting or breaks a
          # core flow. A missing one fails the deploy with a list of names
          # instead of producing pods that start and then misbehave.
          required=(
            DATABASE_URL DIRECT_URL
            AUDIT_HMAC_KEY AUDIT_HMAC_KEY_VERSION
            ADMIN_BEARER_TOKEN PARTICIPANT_PEPPER
            CLERK_SECRET_KEY NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            CLERK_WEBHOOK_SECRET CLERK_ENCRYPTION_KEY
            ADMIN_CLERK_SECRET_KEY NEXT_PUBLIC_ADMIN_CLERK_PUBLISHABLE_KEY
            RESEND_API_KEY RESEND_WEBHOOK_SECRET
            WAITLIST_TOKEN_SECRET
            AZURE_STORAGE_ACCOUNT AZURE_STORAGE_KEY
            TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN
            TWILIO_MESSAGING_SERVICE_SID TWILIO_INBOUND_PHONE
            STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
            INTERNAL_REVALIDATE_SECRET
          )

          # Observability (incl. one WizeLens ingest key per app), maps, billing
          # price ids, the LLM keys and the IndexNow key web serves. Absent is a
          # supported state for each; the platform boots without them.
          optional=(
            STRIPE_PRICE_PRO_MONTHLY STRIPE_PRICE_PRO_YEARLY
            STRIPE_PRICE_ENT_MONTHLY STRIPE_PRICE_ENT_YEARLY
            STRIPE_PRICE_PRO_FOUNDER_MONTHLY STRIPE_PRICE_PRO_FOUNDER_YEARLY
            STRIPE_PRICE_ENT_FOUNDER_MONTHLY STRIPE_PRICE_ENT_FOUNDER_YEARLY
            SENTRY_DSN NEXT_PUBLIC_SENTRY_DSN SENTRY_AUTH_TOKEN
            SENTRY_ORG SENTRY_PROJECT SENTRY_PROJECT_ADMIN
            NEXT_PUBLIC_SENTRY_DSN_ADMIN
            NEXT_PUBLIC_POSTHOG_KEY POSTHOG_API_KEY
            NEXT_PUBLIC_MAPBOX_TOKEN
            ANTHROPIC_API_KEY OPENAI_API_KEY
            INDEXNOW_KEY
            WIZELENS_KEY_WEB WIZELENS_KEY_ADMIN WIZELENS_KEY_API
            WIZELENS_KEY_EMAIL_WORKER WIZELENS_KEY_SMS_WORKER
            WIZELENS_KEY_FLC_VERIFIER WIZELENS_KEY_RESUME_PARSER
            WIZELENS_KEY_CERT_GENERATOR WIZELENS_KEY_SCHEDULER
          )

          # Empty values are SKIPPED, never written as "". A key present with an
          # empty value would shadow the ConfigMap entry of the same name.
          printf 'SENTRY_RELEASE=%s\n' "$SENTRY_RELEASE" > /tmp/agconn.env
          missing=()
          for name in "${required[@]}" "${optional[@]}"; do
            kv_name="${name//_/-}"
            value=$(az keyvault secret show --vault-name "$VAULT" --name "$kv_name" \
                      --query value -o tsv 2>/dev/null || true)
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              printf '%s=%s\n' "$name" "$value" >> /tmp/agconn.env
            elif [[ " ${required[*]} " == *" $name "* ]]; then
              missing+=("$kv_name")
            else
              echo "optional secret absent: $kv_name"
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            rm -f /tmp/agconn.env
            echo "::error::Missing required secrets in $VAULT: ${missing[*]}"
            echo "Set one with: az keyvault secret set --vault-name $VAULT --name <NAME> --value '...'"
            exit 1
          fi

          if ! grep -qE '^(ANTHROPIC_API_KEY|OPENAI_API_KEY)=' /tmp/agconn.env; then
            echo "::warning::No LLM key set — resume parsing and LLM-assisted translation are disabled this deploy."
          fi

          # The vault's DATABASE_URL is agconn_app direct to the server. It becomes PgBouncer's
          # config, and the pods reach the same role through PgBouncer instead.
          pg_dir=$(mktemp -d)
          node scripts/pgbouncer-config.mjs files /tmp/agconn.env "$pg_dir"
          kubectl create secret generic pgbouncer-config -n "$NAMESPACE" \
            --from-file=pgbouncer.ini="$pg_dir/pgbouncer.ini" \
            --from-file=userlist.txt="$pg_dir/userlist.txt" \
            --dry-run=client -o yaml | kubectl apply -f -
          pooled=$(node scripts/pgbouncer-config.mjs pooled-url /tmp/agconn.env "pgbouncer.$NAMESPACE.svc.cluster.local")
          echo "::add-mask::$pooled"
          grep -v '^DATABASE_URL=' /tmp/agconn.env > "$pg_dir/app.env"
          printf 'DATABASE_URL=%s\n' "$pooled" >> "$pg_dir/app.env"
          mv "$pg_dir/app.env" /tmp/agconn.env
          rm -rf "$pg_dir"

          keys=$(wc -l < /tmp/agconn.env)
          kubectl create secret generic agconn-env -n "$NAMESPACE" \
            --from-env-file=/tmp/agconn.env \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/agconn.env
          echo "Applied agconn-env with ${keys} keys."

      # The owner URL and the app role's password, for the migrate Job only: a separate Secret that no
      # Deployment mounts, so a running pod can never connect as agconn_owner. Both are required.
      # printf %s writes the exact bytes, without az's trailing newline.
      - name: Apply the database admin Secret
        run: |
          set -euo pipefail
          umask 077
          dir=$(mktemp -d)
          for name in DATABASE_ADMIN_URL AGCONN_APP_PASSWORD; do
            if ! value=$(az keyvault secret show --vault-name "$VAULT" --name "${name//_/-}" --query value -o tsv); then
              echo "::error::Missing required secret in $VAULT: ${name//_/-}"
              exit 1
            fi
            echo "::add-mask::$value"
            printf '%s' "$value" > "$dir/$name"
          done
          kubectl create secret generic db-admin -n "$NAMESPACE" \
            --from-file=DATABASE_ADMIN_URL="$dir/DATABASE_ADMIN_URL" \
            --from-file=AGCONN_APP_PASSWORD="$dir/AGCONN_APP_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -rf "$dir"

      # ---------------------------------------------------------------------
      # Migrations, seeds and the app role (deploy/k8s/jobs/db-role.sql) run as one in-cluster Job, as
      # agconn_owner: the server is private, and the Job runs the exact image being deployed. Its name
      # carries the tag, so this step waits on this deploy's Job and not a stale one.
      # ---------------------------------------------------------------------
      - name: Migrate the schema
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          API_IMAGE="${REGISTRY}/${IMAGE_PREFIX}-api:${TAG}"

          kubectl delete job "db-migrate-${TAG}" -n "$NAMESPACE" --ignore-not-found
          kubectl create configmap db-role-sql -n "$NAMESPACE" \
            --from-file=db-role.sql=deploy/k8s/jobs/db-role.sql \
            --dry-run=client -o yaml | kubectl apply -f -

          sed -e "s|REPLACE_IMAGE|${API_IMAGE}|g" -e "s|REPLACE_TAG|${TAG}|g" \
            deploy/k8s/base/db-migrate-job.yaml | kubectl apply -f -

          if ! kubectl wait --for=condition=complete "job/db-migrate-${TAG}" \
                 -n "$NAMESPACE" --timeout=600s; then
            echo "::error::Migration job did not complete. Logs follow."
            kubectl logs "job/db-migrate-${TAG}" -n "$NAMESPACE" --all-containers --tail=200 || true
            exit 1
          fi
          kubectl logs "job/db-migrate-${TAG}" -n "$NAMESPACE" --all-containers --tail=50

      # The pods connect through PgBouncer, so it is up before they roll. PgBouncer reads its config
      # once at start, so a changed pgbouncer-config Secret restarts it.
      - name: Start PgBouncer
        run: |
          set -euo pipefail
          kubectl apply -f deploy/k8s/base/pgbouncer.yaml
          hash=$(kubectl get secret pgbouncer-config -n "$NAMESPACE" -o jsonpath='{.data}' | sha256sum | cut -c1-16)
          patch="{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"wizeworks/config-hash\":\"$hash\"}}}}}"
          kubectl patch deployment pgbouncer -n "$NAMESPACE" --type merge -p "$patch"
          kubectl -n "$NAMESPACE" rollout status deployment/pgbouncer --timeout=5m

      - name: Pin image tags
        working-directory: deploy/k8s/overlays/prod
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          for img in web admin api email-worker sms-worker flc-verifier \
                     audit-retention audit-verifier resume-parser \
                     cert-generator scheduler; do
            kustomize edit set image \
              "${REGISTRY}/${IMAGE_PREFIX}-${img}=${REGISTRY}/${IMAGE_PREFIX}-${img}:${TAG}"
          done

      - name: Apply manifests
        run: |
          set -euo pipefail
          kubectl apply -k deploy/k8s/overlays/prod

      # A pod reads its Secrets only when it starts, and a deploy whose image
      # did not change leaves the pods alone, so a changed key went unread.
      # A hash of the Secrets on the pod template changes exactly when they
      # do, and that change rolls the pods.
      - name: Restart pods when their Secrets change
        run: |
          set -euo pipefail
          hash=$(for s in agconn-env; do
            kubectl get secret "$s" -n "$NAMESPACE" \
              -o go-template='{{range $k, $v := .data}}{{$k}}={{$v}};{{end}}'
          done | sha256sum | cut -c1-16)
          patch="{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"wizeworks/secrets-hash\":\"$hash\"}}}}}"
          for d in web admin api email-worker sms-worker scheduler flc-verifier resume-parser cert-generator; do
            kubectl patch deployment "$d" -n "$NAMESPACE" --type merge -p "$patch"
          done

      # Rollout waits are split from the apply so a hung Deployment names itself
      # in the log instead of failing an opaque combined step.
      #
      # The node is single and shared with four other products: every Deployment
      # here is `replicas: 1`, so a rollout SURGES one extra pod each while images
      # are still pulling. If a rollout times out with the pod Pending, read
      # `kubectl -n agconn describe pod` before assuming the image is bad —
      # insufficient memory and a leftover nodeSelector both look like this.
      - name: Wait for rollouts
        run: |
          set -euo pipefail
          for d in web admin api email-worker sms-worker scheduler \
                   flc-verifier resume-parser cert-generator; do
            echo "--- rollout: $d"
            kubectl -n "$NAMESPACE" rollout status "deployment/$d" --timeout=10m
          done

      - name: Ping IndexNow with sitemap URLs
        env:
          INDEXNOW_KEY_LOCATION: https://agconn.com/indexnow-key.txt
          SITE_URL: https://agconn.com
        run: |
          INDEXNOW_KEY=$(az keyvault secret show --vault-name "$VAULT" --name INDEXNOW-KEY \
                           --query value -o tsv 2>/dev/null || true)
          if [ -z "${INDEXNOW_KEY:-}" ]; then
            echo "[indexnow] skipping — INDEXNOW-KEY not in $VAULT"
            exit 0
          fi
          echo "::add-mask::$INDEXNOW_KEY"
          INDEXNOW_KEY="$INDEXNOW_KEY" node scripts/indexnow-ping.mjs
