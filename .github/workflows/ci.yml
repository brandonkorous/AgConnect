name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
            # Migrations and seeds run as agconn_owner, not a superuser, the same as Azure's server admin.
            # The tests run as agconn_app (NOBYPASSRLS), the role production connects as.
            SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/agconn_ci
            DATABASE_URL: postgresql://agconn_owner:agconn_owner_ci@localhost:5432/agconn_ci?schema=public
            DIRECT_URL: postgresql://agconn_owner:agconn_owner_ci@localhost:5432/agconn_ci?schema=public
            DATABASE_ADMIN_URL: postgresql://agconn_owner:agconn_owner_ci@localhost:5432/agconn_ci
            APP_DATABASE_URL: postgresql://agconn_app:agconn_app_ci@localhost:5432/agconn_ci
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: agconn_ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.9.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # All deps, not --prod: the service images copy the whole node_modules, dev deps included.
            # Fails on any high or critical advisory (ignores: package.json pnpm.auditConfig).
            - name: Dependency audit
              run: pnpm audit --audit-level=high

            - name: Generate Prisma client
              run: pnpm db:generate

            - name: Typecheck
              run: pnpm typecheck

            - name: Convention checks (tenant_id, RLS)
              run: pnpm check:conventions

            - name: Script tests
              run: node --test "scripts/*.test.mjs"

            # Azure gives its admin CREATEROLE and CREATEDB, never SUPERUSER; BYPASSRLS is only for the old migrations.
            - name: Create the owner role
              run: |
                  psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 \
                    -c "CREATE ROLE agconn_owner LOGIN PASSWORD 'agconn_owner_ci' CREATEROLE CREATEDB NOSUPERUSER BYPASSRLS" \
                    -c "ALTER DATABASE agconn_ci OWNER TO agconn_owner" \
                    -c "ALTER SCHEMA public OWNER TO agconn_owner"

            # Apply migrations + seed translations against the CI Postgres so the
            # next step can run the live parity check. (Eventually: refactor the
            # check to read seed bundles directly and drop the Postgres service.)
            - name: Migrate CI database
              run: pnpm --filter @agconn/db db:migrate:deploy

            - name: Seed translations
              run: pnpm --filter @agconn/db i18n:seed

            # The April migrations wrote rows the way the old superuser could; prod has had them since.
            # From here the owner has no BYPASSRLS, as on Azure, so the role SQL and helpers are tested that way.
            - name: Take BYPASSRLS from the owner
              run: psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE agconn_owner NOBYPASSRLS"

            # Twice, to prove the role SQL is safe to run again.
            - name: Create the app role
              run: |
                  for i in 1 2; do
                    psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -v app_password=agconn_app_ci \
                      -f deploy/k8s/jobs/db-role.sql
                  done

            - name: Unit tests (as agconn_app)
              run: pnpm -r --if-present test
              env:
                  DATABASE_URL: ${{ env.APP_DATABASE_URL }}

            - name: Database tests (as agconn_app)
              run: pnpm -r --no-bail --if-present test:db
              env:
                  DATABASE_URL: ${{ env.APP_DATABASE_URL }}

            - name: i18n parity
              run: pnpm --filter @agconn/web run i18n:check

            - name: Build packages
              run: pnpm --filter "./packages/**" build

            - name: Build apps/web (smoke)
              run: pnpm --filter @agconn/web build
              env:
                  NEXT_TELEMETRY_DISABLED: "1"
                  # Disable Sentry source map upload during PR builds.
                  SENTRY_AUTH_TOKEN: ""
