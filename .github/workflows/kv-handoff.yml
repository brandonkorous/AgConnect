name: Key Vault handoff (one-time)

# ONE-TIME. Delete after scripts/copy-cluster-secrets-to-keyvault.mjs has run.
#
# FONTAWESOME_TOKEN and INDEXNOW_KEY exist only as GitHub Actions secrets: the
# first is a build secret and the second was never wired into agconn-env, so
# neither is in the cluster. GitHub secrets cannot be read back, but a workflow
# can hand them on. This parks them in a short-lived Secret in the agconn
# namespace, where the copy script picks them up, writes them to Key Vault and
# deletes the Secret. No value is printed.
#
# It does not write Key Vault directly because this identity holds Secrets USER
# there, by design — the thing that deploys must not rewrite what it deploys.

on:
  push:
    branches: [emdash/migrate-from-github-secrets-to-azure-keyvault-kk9gr]
    paths: [.github/workflows/kv-handoff.yml]

permissions:
  contents: read
  id-token: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Park the two GitHub-only secrets in the cluster
        env:
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          umask 077
          az aks get-credentials -g rg-sparx-prod-cus -n aks-sparx-prod-cus --overwrite-existing
          : > /tmp/handoff.env
          for name in FONTAWESOME_TOKEN INDEXNOW_KEY; do
            if [ -n "${!name:-}" ]; then
              printf '%s=%s\n' "$name" "${!name}" >> /tmp/handoff.env
              echo "parked: $name"
            else
              echo "::warning::$name is not set in GitHub"
            fi
          done
          kubectl create secret generic agconn-kv-handoff -n agconn \
            --from-env-file=/tmp/handoff.env --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/handoff.env
