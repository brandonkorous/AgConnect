apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agconn

resources:
  - ../../base

# CI inserts the deploy tag here via `kustomize edit set image`, then commits
# nothing — the edit is transient inside the runner's checkout.
#
# GHCR, matching every other tenant on the shared cluster. THE NAMES ARE
# HYPHENATED — `agconn-web`, not `agconn/web`: GHCR reads a slash as a package
# path under the owner, and these packages must stay PUBLIC so the kubelet pulls
# anonymously (nothing in the base carries an imagePullSecret).
#
# `latest` is the default only so a manual `kubectl apply -k .` works. Every CI
# deploy pins `sha-<short>`.
images:
  - name: ghcr.io/brandonkorous/agconn-web
    newName: ghcr.io/brandonkorous/agconn-web
    newTag: latest
  - name: ghcr.io/brandonkorous/agconn-admin
    newName: ghcr.io/brandonkorous/agconn-admin
    newTag: latest
  - name: ghcr.io/brandonkorous/agconn-api
    newName: ghcr.io/brandonkorous/agconn-api
    newTag: latest
  - name: ghcr.io/brandonkorous/agconn-email-worker
    newName: ghcr.io/brandonkorous/agconn-email-worker
    newTag: latest
  - name: ghcr.io/brandonkorous/agconn-sms-worker
    newName: ghcr.io/brandonkorous/agconn-sms-worker
    newTag: latest
  - name: ghcr.io/brandonkorous/agconn-flc-verifier
    newName: ghcr.io/brandonkorous/agconn-flc-verifier
    newTag: latest
  - name: ghcr.io/brandonkorous/agconn-audit-retention
    newName: ghcr.io/brandonkorous/agconn-audit-retention
    newTag: latest
  - name: ghcr.io/brandonkorous/agconn-audit-verifier
    newName: ghcr.io/brandonkorous/agconn-audit-verifier
    newTag: latest
  - name: ghcr.io/brandonkorous/agconn-resume-parser
    newName: ghcr.io/brandonkorous/agconn-resume-parser
    newTag: latest
  - name: ghcr.io/brandonkorous/agconn-cert-generator
    newName: ghcr.io/brandonkorous/agconn-cert-generator
    newTag: latest
  - name: ghcr.io/brandonkorous/agconn-scheduler
    newName: ghcr.io/brandonkorous/agconn-scheduler
    newTag: latest
