# NOT APPLIED ON THE CURRENT CLUSTER. Kept for reference and for the day the
# topology changes; deliberately absent from kustomization.yaml.
#
# AGCONN runs on the shared `aks-sparx-prod-cus` cluster, which has no
# nginx-ingress controller and no cert-manager. Routing and TLS for agconn.com,
# www.agconn.com, api.agconn.com and admin.agconn.com are handled by the shared
# Caddy proxy in the `sparx-prod` namespace (reserved LB IP 20.12.217.0), which
# reaches these Services cross-namespace at <svc>.agconn.svc.cluster.local. The
# route blocks live in sparx.works/k8s/ingress/Caddyfile.
#
# Those blocks use ON-DEMAND TLS, which means all four AGCONN hostnames must
# ALSO appear in api-rest's PLATFORM_HOSTNAMES allow-list
# (sparx.works/wizeworks/services/api-rest/src/routes/internal/domain-check.ts).
# Removing one there silently costs that hostname its certificate and Cloudflare
# returns 525.
#
# `kubectl apply` on this file fails with `no matches for kind "ClusterIssuer"`
# — the cert-manager CRDs are not installed. That is the expected outcome, not a
# problem to fix by installing cert-manager.

# Ingress: agconn.com / www.agconn.com → web, api.agconn.com → api.
#
# Assumes nginx-ingress + cert-manager are installed cluster-wide (one-time
# bootstrap, see deploy/README.md). The nginx-ingress LoadBalancer is bound to
# the static IP allocated by Terraform (google_compute_address.ingress).
#
# Cert-manager uses Cloudflare DNS01 because Cloudflare proxies traffic to the
# origin (orange cloud), which would intercept HTTP01 challenges. The
# `cloudflare-api-token` Secret is created in the cert-manager namespace at
# bootstrap time from the same CLOUDFLARE_API_TOKEN GitHub secret used by
# Terraform.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_OPS_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: agconn
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["agconn.com", "www.agconn.com"]
      secretName: agconn-web-tls
  rules:
    - host: agconn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
    - host: www.agconn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: agconn
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["api.agconn.com"]
      secretName: agconn-api-tls
  rules:
    - host: api.agconn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 80 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: agconn
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["admin.agconn.com"]
      secretName: agconn-admin-tls
  rules:
    - host: admin.agconn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: admin, port: { number: 80 } }
