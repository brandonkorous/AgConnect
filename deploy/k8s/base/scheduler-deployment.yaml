apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: agconn
  labels: { app.kubernetes.io/name: scheduler, app.kubernetes.io/part-of: agconn }
spec:
  # Singleton — scheduler enqueues time-based jobs (training reminders,
  # application nudges, weekly KPI rollups). Running multiple replicas would
  # double-enqueue. pg-boss schedule cron locks survive node preemption.
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app.kubernetes.io/name: scheduler } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
    spec:
      serviceAccountName: agconn
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: scheduler
          image: ghcr.io/brandonkorous/agconn-scheduler:latest
          envFrom:
            - configMapRef: { name: agconn-config }
            - secretRef: { name: agconn-env }
          env:
            # Caps each @agconn/db pool in this pod; PgBouncer holds the real server connections (AG-11).
            - name: DB_POOL_MAX
              value: "2"
            # WizeLens ingest key for this app alone. Optional: a missing key
            # leaves the pod running, untraced in the cloud.
            - name: WIZELENS_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: agconn-env, key: WIZELENS_KEY_SCHEDULER, optional: true }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { cpu: 250m, memory: 384Mi }
