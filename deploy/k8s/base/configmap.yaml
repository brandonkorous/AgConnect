apiVersion: v1
kind: ConfigMap
metadata:
  name: agconn-config
  namespace: agconn
data:
  NODE_ENV: production
  APP_ENV: production
  NEXT_PUBLIC_APP_ENV: production
  NEXT_PUBLIC_SITE_URL: "https://agconn.com"
  NEXT_PUBLIC_API_BASE_URL: "https://api.agconn.com"
  PUBLIC_API_URL: "https://api.agconn.com"
  PUBLIC_WEB_URL: "https://agconn.com"
  # Public origin of the admin app — metadataBase and Sentry tagging.
  NEXT_PUBLIC_ADMIN_URL: "https://admin.agconn.com"
  # Where api reaches web for the revalidate hook and the health probe. Cluster
  # DNS, so it resolves to the `web` Service inside this namespace and the call
  # never leaves the node. Not a secret, and it must not be one: it lived in the
  # runtime Secret as an unset repository secret, which rendered as "" and made
  # every revalidate POST target an empty URL.
  WEB_INTERNAL_BASE_URL: "http://web"
  # The mirror of the line above, and the one that was missing. web's server-side
  # render fetches every translation from api at /v1/i18n/messages
  # (src/i18n/messages.ts), which reads API_BASE_URL and falls back to
  # NEXT_PUBLIC_API_BASE_URL when it is unset.
  #
  # That fallback is a public hostname, so an unset value sent every SSR message
  # lookup out through Cloudflare and back. On this cluster api.agconn.com does
  # not resolve here yet, so the fetch failed, getMessages returned {}, and
  # next-intl rendered each key as its own path — the page shipped the literal
  # text "landing.pricing" to the browser while still returning 200.
  #
  # Keep it cluster-internal even after DNS lands. A server rendering against its
  # own API has no business leaving the node to do it: the public path adds a
  # round trip through the proxy and makes every render depend on external DNS
  # and TLS being healthy.
  API_BASE_URL: "http://api"
  NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
  POSTHOG_HOST: "https://us.i.posthog.com"
  RESEND_FROM_EMAIL: "AGCONN <hello@agconn.com>"
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/en/sign-in"
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/en/sign-up"
  NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: "/en"
  NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: "/en"
  # TEMPORARY pre-launch test switch — disables the 9PM-7AM PT SMS quiet-hours
  # window so the sole tester isn't blocked mid-flow. Read by both api
  # (enqueue-time defer) and sms-worker (pre-send check) via isQuietHours().
  # REMOVE before real workers are on the platform — quiet-hours compliance is
  # a TCPA/FCC legal requirement. Tracked: revert with launch.
  SMS_QUIET_HOURS_DISABLED: "1"
  # WizeLens tracing (web, admin, api and the pg-boss workers), SEND-ONLY in
  # production: no dashboard, traces go to the hub. Each Deployment maps its own
  # ingest key (WIZELENS_KEY_<APP> in agconn-env) to WIZELENS_HUB_TOKEN.
  WIZELENS_ENABLED: "true"
  WIZELENS_HUB: "https://app.wizelens.com"
  WIZELENS_SAMPLE_RATE: "0.25"
