apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-worker
  namespace: agconn
  labels: { app.kubernetes.io/name: sms-worker, app.kubernetes.io/part-of: agconn }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: sms-worker } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sms-worker
    spec:
      serviceAccountName: agconn
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/brandonkorous/agconn-sms-worker:latest
          envFrom:
            - configMapRef: { name: agconn-config }
            - secretRef: { name: agconn-env }
          env:
            # WizeLens ingest key for this app alone. Optional: a missing key
            # leaves the pod running, untraced in the cloud.
            - name: WIZELENS_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: agconn-env, key: WIZELENS_KEY_SMS_WORKER, optional: true }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
