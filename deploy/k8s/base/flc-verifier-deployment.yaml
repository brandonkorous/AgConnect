apiVersion: apps/v1
kind: Deployment
metadata:
  name: flc-verifier
  namespace: agconn
  labels: { app.kubernetes.io/name: flc-verifier, app.kubernetes.io/part-of: agconn }
spec:
  # replicas: 1, not KEDA. The ScaledObject that owned this count is no longer
  # applied: the shared AKS cluster has no KEDA operator, and scale-to-zero was
  # buying money on a GKE spot pool that no longer exists. On a fixed single
  # node an idle pod costs nothing extra. See keda-scaledobjects.yaml.
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: flc-verifier } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flc-verifier
    spec:
      serviceAccountName: agconn
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/brandonkorous/agconn-flc-verifier:latest
          envFrom:
            - configMapRef: { name: agconn-config }
            - secretRef: { name: agconn-env }
          env:
            # Caps each @agconn/db pool in this pod; PgBouncer holds the real server connections (AG-11).
            - name: DB_POOL_MAX
              value: "2"
            # WizeLens ingest key for this app alone. Optional: a missing key
            # leaves the pod running, untraced in the cloud.
            - name: WIZELENS_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: agconn-env, key: WIZELENS_KEY_FLC_VERIFIER, optional: true }
          resources:
            requests: { cpu: 25m, memory: 192Mi }
            # MSPA ingest holds ~12k rows in memory while parsing; bumping
            # the limit gives headroom over the email/sms workers.
            limits: { cpu: 1000m, memory: 768Mi }
