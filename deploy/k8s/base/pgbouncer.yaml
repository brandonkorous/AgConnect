# PgBouncer in front of psql-agconn-prod-cus (AG-11), modelled on sparx.works/k8s/azure/infra/pgbouncer.yaml.
# B1ms allows 50 connections; one pod caps the server side at 40 (scripts/pgbouncer-config.mjs), leaving room for migrations.
# Config is the `pgbouncer-config` Secret the deploy writes from the vault's DATABASE-URL (agconn_app).
# Only agconn_app goes through it; migrations and the role job connect direct as agconn_owner.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: agconn
  labels: { app.kubernetes.io/name: pgbouncer, app.kubernetes.io/part-of: agconn }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app.kubernetes.io/name: pgbouncer } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pgbouncer }
    spec:
      enableServiceLinks: false
      # Group 70 (postgres) reads the 0440 config files.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.1-p0
          # Set here too: the deploy applies this file on its own before the kustomize patch runs.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - name: pgbouncer
              containerPort: 5432
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
              readOnly: true
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          livenessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          secret:
            secretName: pgbouncer-config
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: agconn
  labels: { app.kubernetes.io/name: pgbouncer }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: pgbouncer }
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: 5432
---
# Only pods in this namespace reach the pooler (staged like the rest of network-policy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer-from-namespace
  namespace: agconn
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pgbouncer }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
